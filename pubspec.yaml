name: meteor_net
description: A pragmatic Dio based network layer with interceptors, typed parsing, cache, retry, mock, proxy, and WebSocket support.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.3
  dio: ^5.7.0
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^4.0.0
